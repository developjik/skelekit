name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            apps/grave-dash/package-lock.json
            apps/oppboard/package-lock.json

      - name: Build Grave Dash
        working-directory: apps/grave-dash
        run: npm ci && npm test && npm run build

      - name: Build OppBoard
        working-directory: apps/oppboard
        run: npm ci && npm test && npm run build

      - name: Assemble site
        run: |
          mkdir -p _site
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>SkeleKit — one skeleton, very different apps</title>
            <style>
              :root { color-scheme: dark; }
              * { box-sizing: border-box; }
              body {
                margin: 0; min-height: 100vh; display: grid; place-items: center;
                background: #0d0a1a; color: #eee6f0;
                font-family: ui-serif, Georgia, serif; text-align: center; padding: 2rem;
              }
              main { max-width: 42rem; }
              h1 { font-size: clamp(2rem, 6vw, 3.5rem); margin: 0 0 .5rem; }
              h1 span { opacity: .7; }
              p.lead { color: #b9a8cf; font-size: 1.15rem; margin: 0 0 2.5rem; }
              .apps { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); }
              a.app {
                display: block; padding: 1.5rem 1rem; border: 1px solid #3a2b5c; border-radius: 14px;
                background: #171128; color: inherit; text-decoration: none; transition: transform .15s;
              }
              a.app:hover { transform: translateY(-3px); border-color: #ff7700; }
              a.app b { display: block; font-size: 1.3rem; margin-bottom: .35rem; }
              a.app small { color: #b9a8cf; }
              footer { margin-top: 2.5rem; color: #8d7fa8; font-size: .9rem; }
              footer a { color: #ff9a3d; }
            </style>
          </head>
          <body>
            <main>
              <h1>SkeleKit <span>☠️</span></h1>
              <p class="lead">One skeleton template, two very different apps — generated by Kiro from specs.</p>
              <div class="apps">
                <a class="app" href="./grave-dash/"><b>👻 Grave Dash</b><small>One-button spooky arcade game<br/>(canvas + fixed-timestep loop)</small></a>
                <a class="app" href="./oppboard/"><b>📋 OppBoard</b><small>Dev opportunity deadline board<br/>(hash router + data table)</small></a>
              </div>
              <footer>Built for Kiroween 2026 · Skeleton Crew · <a href="https://github.com/developjik/skelekit">source on GitHub</a></footer>
            </main>
          </body>
          </html>
          HTML
          cp -r apps/grave-dash/dist _site/grave-dash
          cp -r apps/oppboard/dist _site/oppboard
          ls -R _site | head -20

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
